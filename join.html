<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help — Join Private Call</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="grid-bg"></div>
<div class="wrap">

  <div class="nameplate">
    <div>
      <span class="tag">Private Session</span>
      <h1>Join a Call</h1>
    </div>
    <div style="font-size:12px; color:var(--dim);">
      <span class="status-dot" id="statusDot"></span><span id="statusLabel">Not connected</span>
    </div>
  </div>

  <div class="panel" id="joinPanel">
    <span class="panel-label">Enter code</span>
    <input type="text" id="codeInput" maxlength="4" placeholder="XXXX" style="text-transform:uppercase; letter-spacing:0.3em; font-size:24px; text-align:center;">
    <button class="primary" id="joinBtn">Join</button>
    <p id="joinMsg" style="font-size:12px; color:var(--dim); margin-top:8px;"></p>
  </div>

  <div id="callPanel" style="display:none;">
    <div class="video-stage">
      <div class="video-box">
        <video id="remoteVideo" autoplay playsinline></video>
        <span class="caption">Host</span>
      </div>
      <div class="video-box">
        <video id="localVideo" autoplay playsinline muted></video>
        <span class="caption">You</span>
      </div>
    </div>

    <div class="panel">
      <span class="panel-label">Text channel</span>
      <div class="chat-log" id="chatLog"></div>
      <div style="display:flex; gap:8px;">
        <input type="text" id="chatInput" placeholder="Type a message…" style="margin-bottom:0;">
        <button id="sendBtn">Send</button>
      </div>
    </div>

    <div class="controls-row">
      <button id="muteBtn" class="ghost">Mute Mic</button>
      <button id="cameraBtn" class="ghost">Stop Camera</button>
      <button id="endBtn" class="danger">End Session</button>
    </div>
  </div>

</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const PREFIX = "help-"; // must match code.html

const statusDot = document.getElementById('statusDot');
const statusLabel = document.getElementById('statusLabel');
function setStatus(text, mode) {
  statusLabel.textContent = text;
  statusDot.className = 'status-dot' + (mode ? ' ' + mode : '');
}

let peer, localStream, mediaConn, dataConn;

document.getElementById('joinBtn').onclick = async () => {
  const btn = document.getElementById('joinBtn');
  const msg = document.getElementById('joinMsg');
  const code = document.getElementById('codeInput').value.trim().toUpperCase();

  if (code.length !== 4) {
    msg.textContent = 'Enter the 4-character code.';
    return;
  }

  btn.disabled = true;
  msg.textContent = 'Getting camera/mic access…';
  setStatus('Connecting…', '');

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  } catch (e) {
    msg.textContent = 'Camera/mic access denied or unavailable. Allow access and try again.';
    btn.disabled = false;
    setStatus('Not connected', 'alert');
    return;
  }

  peer = new Peer();
  peer.on('open', () => {
    msg.textContent = 'Connecting to host…';
    mediaConn = peer.call(PREFIX + code, localStream);
    dataConn = peer.connect(PREFIX + code);
    dataConn.on('open', () => setupChat(dataConn));

    mediaConn.on('stream', (remoteStream) => {
      document.getElementById('remoteVideo').srcObject = remoteStream;
      document.getElementById('localVideo').srcObject = localStream;
      document.getElementById('joinPanel').style.display = 'none';
      document.getElementById('callPanel').style.display = 'block';
      setStatus('Connected', 'live');
    });
    mediaConn.on('close', cleanup);
    mediaConn.on('error', () => {
      msg.textContent = 'Could not reach that code. Check it and try again.';
      btn.disabled = false;
      setStatus('Not connected', 'alert');
    });

    setTimeout(() => {
      if (document.getElementById('callPanel').style.display === 'none') {
        msg.textContent = 'No answer from that code. Check it and try again.';
        btn.disabled = false;
        setStatus('Not connected', 'alert');
      }
    }, 15000);
  });

  peer.on('error', (err) => {
    msg.textContent = 'Connection error: ' + err.type;
    btn.disabled = false;
    setStatus('Not connected', 'alert');
  });
};

function setupChat(conn) {
  conn.on('data', (data) => appendChat('Host', data, false));
  document.getElementById('sendBtn').onclick = () => {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || !conn.open) return;
    conn.send(text);
    appendChat('You', text, true);
    input.value = '';
  };
  document.getElementById('chatInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('sendBtn').click();
  });
}

function appendChat(who, text, self) {
  const log = document.getElementById('chatLog');
  const line = document.createElement('div');
  line.className = 'chat-line' + (self ? ' self' : '');
  const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  line.innerHTML = `<span class="who">${who}:</span>${escapeHtml(text)}<span class="t">${time}</span>`;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

document.getElementById('muteBtn').onclick = (e) => {
  const track = localStream.getAudioTracks()[0];
  track.enabled = !track.enabled;
  e.target.textContent = track.enabled ? 'Mute Mic' : 'Unmute Mic';
};
document.getElementById('cameraBtn').onclick = (e) => {
  const track = localStream.getVideoTracks()[0];
  track.enabled = !track.enabled;
  e.target.textContent = track.enabled ? 'Stop Camera' : 'Start Camera';
};
document.getElementById('endBtn').onclick = () => {
  if (mediaConn) mediaConn.close();
  if (dataConn) dataConn.close();
  cleanup();
};

function cleanup() {
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  if (peer) peer.destroy();
  setStatus('Session ended', 'alert');
  setTimeout(() => location.reload(), 1200);
}
</script>
</body>
</html>
